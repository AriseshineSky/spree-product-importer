[store_db]
host = localhost
user = root
password = secret
name = store

# PostgreSQL (SQLAlchemy). Use either `url` or host/user/password/name.
[pg_db]
host = localhost
port = 5432
user = postgres
password = secret
name = spree
# product_sources_table = product_sources
# driver = psycopg
# url = postgresql+psycopg://postgres:secret@localhost:5432/spree

# ---------------------------------------------------------------------------
# Spree product importer — store defaults + per-source overrides
# Section: [spree.import.{store_code}]
# Source:  [spree.import.{store_code}.{source_name}]
# ---------------------------------------------------------------------------
[spree.import.em-spree]
merchant_id = 654568556
vendor_id = 24
min_shipping_days = 10
min_price = 15
daily_upload_limit = 80000
quota_timezone = America/Chicago
sources = amz_ca, amz_uk, ebay_us
# Product source prefixes that skip spray / perfume title filters
skip_spray_source_prefixes = amz_, ebay
skip_perfume_source_prefixes = ebay

[spree.import.em-spree.amz_ca]
products_path = /home/Admin/em-tasks/data/amazon/amz_ca_to_upload.jsonl
stock_location_id = 19
shipping_category_id = 46901

[spree.import.em-spree.amz_uk]
products_path = /home/Admin/em-tasks/data/amazon/amz_uk_to_upload.jsonl
stock_location_id = 41
shipping_category_id = 46873

[spree.import.em-spree.ebay_us]
products_path = /home/Admin/em-tasks/data/ebay/ebay_us_to_upload.jsonl
stock_location_id = 19
shipping_category_id = 46862

# EM-HU (vendor 62) — AliExpress + InspireUplift
[spree.import.em-spree.v62]
merchant_id = 654568556
vendor_id = 62
stock_location_id = 70
shipping_category_id = 46910
min_shipping_days = 10
min_price = 15
daily_upload_limit = 80000
quota_timezone = America/Chicago
sources = aliexpress, aliexpress_quality, inspireuplift
skip_spray_source_prefixes = aliexpress, inspireuplift
skip_perfume_source_prefixes = aliexpress, inspireuplift

[spree.import.em-spree.v62.aliexpress]
products_path = /home/Admin/em-tasks/data/aliexpress/quality_to_upload.multi_variant.from_prepare.jsonl

[spree.import.em-spree.v62.aliexpress_quality]
products_path = /home/Admin/em-tasks/data/aliexpress/quality_to_upload.jsonl

[spree.import.em-spree.v62.inspireuplift]
products_path = /home/Admin/em-tasks/data/inspireuplift/inspireuplift_to_upload.multi_variant.jsonl
