[store_db]
host = localhost
user = root
password = secret
name = store

# PostgreSQL (SQLAlchemy). Use either `url` or host/user/password/name.
[pg_db]
host = localhost
port = 5432
user = postgres
password = secret
name = spree
# product_sources_table = product_sources
# driver = psycopg
# url = postgresql+psycopg://postgres:secret@localhost:5432/spree

# ---------------------------------------------------------------------------
# Spree product importer
# Shared store defaults: [spree.import.{store}]
# Vendor profile (required): [spree.import.{store}.{vendor_key}]
# Source overrides: [spree.import.{store}.{vendor_key}.{source}]
# CLI: -s {store} -vn {vendor_key|vendor_name}
# ---------------------------------------------------------------------------
[spree.import.em-spree]
merchant_id = 654568556
min_shipping_days = 10
min_price = 15
daily_upload_limit = 80000
quota_timezone = America/Chicago
# Amazon titles may be local-language; skip English-title gate for amz_*.
skip_english_title_source_prefixes = amz_

[spree.import.em-spree.topselected]
vendor_name = TopSelected
vendor_id = 24
sources = amz_ca, amz_us, amz_uk, ebay_us
skip_spray_source_prefixes = amz_, ebay
skip_perfume_source_prefixes = ebay

[spree.import.em-spree.topselected.amz_ca]
products_path = /home/Admin/em-tasks/data/amazon/amz_ca_to_upload.jsonl
stock_location_id = 19
shipping_category_id = 46901

